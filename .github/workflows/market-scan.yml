name: HVLK AI US Market Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1-5"
permissions:
  contents: write
concurrency:
  group: hvlk-ai-market-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update US instrument universe
        run: python universe.py
      - name: Run market scanner
        run: python scanner.py
      - name: Save scan results
        run: |
          git config user.name "HVLK AI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.json data/results.json data/market.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update HVLK AI US market data"
            git push
          fi
